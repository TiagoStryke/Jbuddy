<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jbuddy</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <div class="drag-strip" data-tauri-drag-region></div>
    <main class="app">
      <header class="bar" data-tauri-drag-region>
        <div class="brand">
          <span class="logo">J</span>
          <span class="wordmark">Jbuddy</span>
        </div>
        <span class="state-pill glass" id="state-pill" data-state="">
          <i class="dot"></i>
          <span id="state">—</span>
        </span>
      </header>

      <section class="hero">
        <div class="ring">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <defs>
              <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="var(--accent)" />
                <stop offset="100%" stop-color="var(--accent-2)" />
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="100" cy="100" r="86" />
            <circle
              class="ring-fill"
              id="ring"
              cx="100"
              cy="100"
              r="86"
              transform="rotate(-90 100 100)"
            />
          </svg>
          <div class="ring-center">
            <img class="mascot" id="mascot" alt="" />
            <span class="ring-value tnum" id="working">0h00</span>
            <span class="ring-label" data-i18n="focus.today">focus today</span>
          </div>
        </div>
      </section>

      <section class="stats">
        <article class="card glass">
          <span class="stat-num tnum" id="idle">0h00</span>
          <span class="stat-label" data-i18n="stat.idle">idle</span>
        </article>
        <article class="card glass">
          <span class="stat-num tnum" id="away">0h00</span>
          <span class="stat-label" data-i18n="stat.away">away</span>
        </article>
        <article class="card glass">
          <span class="stat-num tnum" id="focus">—</span>
          <span class="stat-label" data-i18n="stat.focus">focus</span>
        </article>
      </section>

      <section class="panel glass">
        <h3 data-i18n="dash.week">this week</h3>
        <div class="week" id="week"></div>
      </section>

      <section class="panel glass">
        <div class="panel-head">
          <h3 data-i18n="dash.byHour">focus by hour</h3>
          <span class="peak" id="peak"></span>
        </div>
        <div class="hours" id="hours"></div>
        <div class="hours-axis"><span>0h</span><span>6h</span><span>12h</span><span>18h</span><span>23h</span></div>
      </section>
    </main>
  </body>
</html>
