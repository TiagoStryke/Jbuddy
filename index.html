<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jbuddy</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>🧑‍💻 Jbuddy</h1>
      <p class="muted">Painel em construção — Fase 1: tracking real.</p>

      <section class="stats">
        <div class="stat">
          <span class="stat-value" id="working">—</span>
          <span class="stat-label">efetivas hoje</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="idle">—</span>
          <span class="stat-label">ocioso</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="away">—</span>
          <span class="stat-label">ausente</span>
        </div>
      </section>
      <p class="muted">Estado atual: <strong id="state">—</strong></p>
    </main>
  </body>
</html>
